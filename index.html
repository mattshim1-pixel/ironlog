<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironlog">
<meta name="theme-color" content="#141410">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23141410'/%3E%3Crect x='38' y='78' width='104' height='24' rx='6' fill='%23e6b34a'/%3E%3Crect x='24' y='62' width='18' height='56' rx='4' fill='%23e6b34a'/%3E%3Crect x='138' y='62' width='18' height='56' rx='4' fill='%23e6b34a'/%3E%3C/svg%3E">
<title>Ironlog</title>
<style>
  :root{
    --bg:#141410; --surface:#1d1d16; --surface2:#26261c;
    --line:rgba(240,238,220,.09); --line2:rgba(240,238,220,.16);
    --text:#f1efe4; --muted:#90907f; --faint:#5f5f52;
    --accent:#e6b34a; --accent-dim:rgba(230,179,74,.14); --accent-line:rgba(230,179,74,.4);
    --pos:#93b671; --danger:#cc6f5d;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:16px; line-height:1.4; overscroll-behavior-y:none;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}

  /* header */
  header{
    position:sticky; top:0; z-index:20; background:rgba(20,20,16,.86);
    backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line);
    padding:calc(var(--safe-t) + 12px) 18px 12px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .brand{font-family:var(--mono); font-weight:600; font-size:19px; letter-spacing:.02em; display:flex; align-items:baseline; gap:8px}
  .brand b{color:var(--accent)}
  .brand span{font-size:11px; color:var(--faint); letter-spacing:.12em; text-transform:uppercase}
  .gear{background:none;border:none;color:var(--muted);font-size:22px;padding:4px;cursor:pointer}
  .gear:active{color:var(--text)}

  /* views */
  main{flex:1; padding:16px 16px 96px; animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){main{animation:none} *{transition:none!important}}
  .view-title{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; font-weight:600}

  /* bottom nav */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(20,20,16,.9); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex; padding:8px 8px calc(var(--safe-b) + 8px);
    max-width:560px; margin:0 auto;
  }
  nav button{
    flex:1; background:none; border:none; color:var(--faint); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
    font-family:var(--sans);
  }
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  nav button.on{color:var(--accent)}

  /* generic */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .row{display:flex; align-items:center; gap:10px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .mono{font-family:var(--mono)}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .small{font-size:13px}
  .tiny{font-size:11px}
  .grow{flex:1}
  .right{text-align:right}
  .center{text-align:center}
  .mt{margin-top:12px}
  .empty{color:var(--muted); text-align:center; padding:40px 16px; font-size:14px; line-height:1.6}
  .empty b{color:var(--text); display:block; margin-bottom:6px; font-size:15px}

  button.btn{
    font-family:var(--sans); font-size:15px; font-weight:600; cursor:pointer;
    border-radius:11px; padding:13px 16px; border:1px solid var(--line2);
    background:var(--surface2); color:var(--text); width:100%;
  }
  button.btn:active{transform:scale(.985)}
  button.btn.primary{background:var(--accent); color:#1a1509; border-color:var(--accent)}
  button.btn.ghost{background:none}
  button.btn.danger{color:var(--danger); border-color:rgba(204,111,93,.4)}
  button.btn.sm{padding:9px 12px; font-size:13px; width:auto}
  .btn-row{display:flex; gap:10px}
  .btn-row .btn{flex:1}

  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px;
    background:var(--surface2); border:1px solid var(--line2); color:var(--text);
    font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .chip.on{background:var(--accent); color:#1a1509; border-color:var(--accent)}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .scroll-x{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
  .scroll-x::-webkit-scrollbar{display:none}

  input,select,textarea{
    font-family:var(--sans); font-size:16px; color:var(--text);
    background:var(--surface2); border:1px solid var(--line2); border-radius:9px;
    padding:11px 12px; width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent-line)}
  input.num,.num-field{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:center}
  label.fld{display:block; margin-bottom:12px}
  label.fld .lab{font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; display:block; font-weight:600}

  .seg{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:3px; margin-bottom:16px}
  .seg button{flex:1; background:none; border:none; color:var(--muted); font-family:var(--sans); font-size:14px; font-weight:600; padding:9px; border-radius:8px; cursor:pointer}
  .seg button.on{background:var(--accent); color:#1a1509}

  /* set logging */
  .ex-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden}
  .ex-head{display:flex; align-items:center; justify-content:space-between; padding:13px 14px; gap:8px; border-bottom:1px solid var(--line)}
  .ex-name{font-weight:600; font-size:16px}
  .ex-meta{font-size:11px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase; margin-top:2px}
  .ex-x{background:none;border:none;color:var(--faint);font-size:20px;padding:2px 6px;cursor:pointer}
  .set{display:grid; grid-template-columns:26px 1fr 1fr 34px; gap:8px; align-items:center; padding:9px 14px}
  .set + .set{border-top:1px solid var(--line)}
  .set-n{font-family:var(--mono); color:var(--faint); font-size:13px; text-align:center}
  .set.done .set-n{color:var(--accent)}
  .stepper{display:flex; align-items:center; background:var(--surface2); border:1px solid var(--line2); border-radius:9px; overflow:hidden}
  .stepper button{width:32px; height:42px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; flex:none}
  .stepper button:active{color:var(--accent); background:var(--accent-dim)}
  .stepper input{border:none; border-radius:0; background:none; padding:8px 2px; text-align:center; min-width:0; font-family:var(--mono); font-size:16px}
  .stepper .unit{font-size:10px; color:var(--faint); padding-right:8px}
  .set-lab{grid-column:2/4; display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:10px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; text-align:center; padding:0 0 2px}
  .check{width:34px; height:42px; border-radius:9px; border:1px solid var(--line2); background:var(--surface2); color:var(--faint); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .check.on{background:var(--accent); color:#1a1509; border-color:var(--accent)}
  .ghost{font-family:var(--mono); font-size:11px; color:var(--faint); padding:0 14px 10px}
  .pr{display:inline-block; font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.1em; color:#1a1509; background:var(--accent); padding:2px 5px; border-radius:4px; margin-left:8px; vertical-align:middle}
  .ex-foot{padding:10px 14px; border-top:1px solid var(--line)}
  .link{color:var(--accent); background:none; border:none; font-size:14px; font-weight:600; cursor:pointer; font-family:var(--sans); padding:0}

  /* history list */
  .sess{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; color:var(--text); font-family:var(--sans)}
  .sess:active{border-color:var(--line2)}
  .sess-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .sess-date{font-family:var(--mono); font-size:13px; color:var(--muted)}
  .sess-name{font-weight:600; font-size:16px}
  .sess-stats{font-family:var(--mono); font-size:12px; color:var(--faint)}
  .tag{font-size:11px; color:var(--accent); background:var(--accent-dim); border-radius:6px; padding:2px 8px; font-weight:600}

  /* chart */
  .chart{width:100%; height:auto; display:block; margin:4px 0 8px}
  .chart text{font-family:var(--mono); font-size:9px; fill:var(--faint)}
  .chart .grid{stroke:var(--line); stroke-width:1}
  .chart .ln{stroke:var(--accent); stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round}
  .chart .area{fill:var(--accent-dim)}
  .chart .dot{fill:var(--accent)}
  .stat-row{display:flex; gap:10px; margin-bottom:14px}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px}
  .stat .k{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .stat .v{font-family:var(--mono); font-size:22px; margin-top:4px}
  .stat .v small{font-size:12px; color:var(--faint)}

  /* modal */
  .scrim{position:fixed; inset:0; background:rgba(10,10,8,.6); z-index:40; display:flex; align-items:flex-end; justify-content:center; animation:fade .18s}
  .sheet{background:var(--bg); border:1px solid var(--line2); border-bottom:none; border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; padding:18px 16px calc(var(--safe-b) + 20px); -webkit-overflow-scrolling:touch}
  .sheet-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
  .sheet-h h2{font-size:18px; font-weight:600}
  .sheet-h .x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer}
  .exline{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:15px}
  .exline .num{color:var(--muted); font-size:13px}
  .prog-row{display:flex; justify-content:space-between; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:8px; align-items:center; cursor:pointer; color:var(--text); font-family:var(--sans); text-align:left}
  .prog-row .best{font-family:var(--mono); color:var(--accent); font-size:14px}
  textarea{min-height:150px; font-family:var(--mono); font-size:13px; line-height:1.5; resize:vertical}
  .hint{font-size:12px; color:var(--muted); line-height:1.6; margin:8px 0 12px}
  .hint code{background:var(--surface2); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:11px}
  .toast{position:fixed; bottom:calc(var(--safe-b) + 90px); left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--line2); color:var(--text); padding:11px 18px; border-radius:999px; font-size:14px; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:fade .2s}
  .divider{height:1px; background:var(--line); margin:16px 0}
  .del-x{background:none;border:none;color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;padding:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">IRON<b>LOG</b> <span id="hdrSub"></span></div>
    <button class="gear" onclick="openSettings()" aria-label="Settings">⚙</button>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- state ---------- */
const KEY="ironlog.v1";
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);

const EXAMPLE={
  id:uid(), name:"Example — Upper / Lower",
  days:[
    {id:uid(),name:"Upper",exercises:[
      {id:uid(),name:"Barbell Bench Press",sets:4,repRange:"6-8"},
      {id:uid(),name:"Bent-Over Row",sets:4,repRange:"6-8"},
      {id:uid(),name:"Overhead Press",sets:3,repRange:"8-10"},
      {id:uid(),name:"Chin-Up",sets:3,repRange:"AMRAP"}
    ]},
    {id:uid(),name:"Lower",exercises:[
      {id:uid(),name:"Back Squat",sets:4,repRange:"5-8"},
      {id:uid(),name:"Romanian Deadlift",sets:3,repRange:"8-10"},
      {id:uid(),name:"Walking Lunge",sets:3,repRange:"10-12"},
      {id:uid(),name:"Standing Calf Raise",sets:4,repRange:"12-15"}
    ]}
  ]
};

let S=load();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {version:1, programs:[EXAMPLE], activeProgramId:EXAMPLE.id,
          sessions:[], bodyweight:[], draft:null, settings:{unit:"kg"}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Storage full — export a backup"); } }
const unit=()=>S.settings.unit||"kg";

/* ---------- helpers ---------- */
function fmtNum(n){ if(n==null||n==="") return "–"; const v=Math.round(n*100)/100; return (Number.isInteger(v)?v:v.toFixed(v*10%1?2:1)); }
function e1rm(w,r){ if(!w||!r) return 0; return w*(1+r/30); } // Epley
function sessionVolume(s){ let v=0; s.exercises.forEach(ex=>ex.sets.forEach(st=>{ if(st.done!==false && st.weight&&st.reps) v+=st.weight*st.reps; })); return v; }
function sessionSets(s){ let n=0; s.exercises.forEach(ex=>ex.sets.forEach(st=>{ if(st.done!==false) n++; })); return n; }
function prettyDate(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"}); }

// best est-1RM for an exercise across finished sessions (optionally excluding a session id)
function bestE1RM(name,exclId){
  let best=0;
  S.sessions.forEach(s=>{ if(s.id===exclId) return;
    s.exercises.forEach(ex=>{ if(ex.name.toLowerCase()!==name.toLowerCase()) return;
      ex.sets.forEach(st=>{ if(st.weight&&st.reps){ best=Math.max(best,e1rm(st.weight,st.reps)); } }); }); });
  return best;
}
// most recent logged sets for an exercise (for auto-fill ghost)
function lastSets(name){
  for(let i=S.sessions.length-1;i>=0;i--){
    const ex=S.sessions[i].exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(ex&&ex.sets.length) return ex.sets;
  }
  return null;
}

/* ---------- routing ---------- */
let TAB="train";
const TABS=[
  {id:"train",label:"Train",icon:'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>'},
  {id:"history",label:"History",icon:'<path d="M12 8v4l3 2M4 12a8 8 0 1 0 2.3-5.6M4 4v3h3"/>'},
  {id:"body",label:"Body",icon:'<path d="M12 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 9h8l-1 5h-2v7h-2v-7H9z"/>'},
  {id:"programs",label:"Programs",icon:'<path d="M5 4h11l3 3v13H5zM8 9h8M8 13h8M8 17h5"/>'}
];
function go(t){ TAB=t; render(); window.scrollTo(0,0); }
function renderNav(){
  document.getElementById("nav").innerHTML=TABS.map(t=>
    `<button class="${TAB===t.id?'on':''}" onclick="go('${t.id}')">
      <svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}</button>`).join("");
}
function render(){
  renderNav();
  const m=document.getElementById("main");
  if(TAB==="train") m.innerHTML=viewTrain();
  else if(TAB==="history") m.innerHTML=viewHistory();
  else if(TAB==="body") m.innerHTML=viewBody();
  else if(TAB==="programs") m.innerHTML=viewPrograms();
  document.getElementById("hdrSub").textContent = TAB==="train" && S.draft ? "· logging" : "";
}

/* ---------- TRAIN ---------- */
let HISTSEG="sessions";
function viewTrain(){
  if(!S.draft){
    const prog=S.programs.find(p=>p.id===S.activeProgramId)||S.programs[0];
    let html=`<div class="view-title">Start a session</div>`;
    if(prog){
      html+=`<div class="card"><div class="row between" style="margin-bottom:12px">
        <div><div class="small muted">Active program</div><div style="font-weight:600;font-size:16px">${esc(prog.name)}</div></div></div>
        <div class="scroll-x">`;
      prog.days.forEach(d=>{ html+=`<button class="chip" onclick="startDay('${prog.id}','${d.id}')">${esc(d.name)}</button>`; });
      html+=`</div></div>`;
    } else {
      html+=`<div class="empty"><b>No programs yet</b>Add one under Programs, or start an empty session below.</div>`;
    }
    html+=`<button class="btn ghost mt" onclick="startEmpty()">+ Empty session</button>`;
    // recent
    if(S.sessions.length){
      html+=`<div class="view-title" style="margin-top:26px">Recent</div>`;
      S.sessions.slice(-3).reverse().forEach(s=>html+=sessCard(s));
    }
    return html;
  }
  // active draft
  const d=S.draft;
  let html=`<div class="row between" style="margin-bottom:14px">
    <div><div style="font-weight:600;font-size:18px">${esc(d.dayName||"Session")}</div>
    <div class="small muted num">${prettyDate(d.date)}</div></div>
    <button class="btn sm ghost" onclick="cancelDraft()">Discard</button></div>`;
  d.exercises.forEach((ex,ei)=>html+=exCard(ex,ei));
  html+=`<button class="btn ghost" onclick="addExercise()">+ Add exercise</button>`;
  html+=`<button class="btn primary mt" onclick="finishSession()">Finish session</button>`;
  return html;
}
function exCard(ex,ei){
  const best=bestE1RM(ex.name);
  const last=lastSets(ex.name);
  let html=`<div class="ex-card"><div class="ex-head">
    <div><div class="ex-name">${esc(ex.name)}</div>
    ${best?`<div class="ex-meta">Best e1RM ${fmtNum(best)}${unit()}</div>`:``}</div>
    <button class="ex-x" onclick="removeExercise(${ei})">✕</button></div>`;
  html+=`<div class="set"><div></div><div class="set-lab"><span>Weight (${unit()})</span><span>Reps</span></div><div></div></div>`;
  ex.sets.forEach((st,si)=>{
    const done=st.done!==false;
    const isPR = st.weight&&st.reps && e1rm(st.weight,st.reps) > best-0.01 && e1rm(st.weight,st.reps)>0 && bestE1RM(ex.name)<=e1rm(st.weight,st.reps);
    const g = last&&last[si] ? `${fmtNum(last[si].weight)}×${last[si].reps}` : "";
    html+=`<div class="set ${done?'done':''}">
      <div class="set-n">${si+1}</div>
      <div class="stepper">
        <button onclick="stepSet(${ei},${si},'weight',-1)">−</button>
        <input class="num-field" inputmode="decimal" value="${st.weight??''}" placeholder="${g?fmtNum(last[si].weight):'–'}" onchange="setVal(${ei},${si},'weight',this.value)">
        <button onclick="stepSet(${ei},${si},'weight',1)">+</button>
      </div>
      <div class="stepper">
        <button onclick="stepSet(${ei},${si},'reps',-1)">−</button>
        <input class="num-field" inputmode="numeric" value="${st.reps??''}" placeholder="${g?last[si].reps:'–'}" onchange="setVal(${ei},${si},'reps',this.value)">
        <button onclick="stepSet(${ei},${si},'reps',1)">+</button>
      </div>
      <button class="check ${done?'on':''}" onclick="toggleDone(${ei},${si})">✓</button>
    </div>`;
    if(isPR) html+=`<div class="ghost" style="padding-top:0"><span class="pr">PR</span> est. 1RM ${fmtNum(e1rm(st.weight,st.reps))}${unit()}</div>`;
  });
  html+=`<div class="ex-foot row between">
    <button class="link" onclick="addSet(${ei})">+ Add set</button>
    ${ex.sets.length>1?`<button class="link faint" onclick="removeSet(${ei})">Remove set</button>`:``}</div></div>`;
  return html;
}

function startDay(pid,did){
  const p=S.programs.find(x=>x.id===pid); const day=p.days.find(x=>x.id===did);
  S.draft={ id:uid(), date:todayISO(), programId:pid, dayId:did, dayName:day.name,
    exercises: day.exercises.map(ex=>({ name:ex.name,
      sets: Array.from({length:ex.sets||3},()=>({weight:"",reps:"",done:false})) })) };
  save(); render();
}
function startEmpty(){ S.draft={id:uid(),date:todayISO(),dayName:"Freestyle",exercises:[]}; save();
  render(); addExercise(); }
function cancelDraft(){ if(confirm("Discard this session? Logged sets will be lost.")){ S.draft=null; save(); render(); } }
function stepSet(ei,si,f,dir){
  const st=S.draft.exercises[ei].sets[si];
  const step = f==="weight" ? 2.5 : 1;
  let v=parseFloat(st[f]);
  if(isNaN(v)){ // seed from ghost/last
    const last=lastSets(S.draft.exercises[ei].name);
    v = last&&last[si]&&last[si][f]!=null ? parseFloat(last[si][f]) : 0;
    if(isNaN(v)) v=0;
  }
  v=Math.max(0, v + dir*step);
  st[f]= f==="reps" ? Math.round(v) : Math.round(v*10)/10;
  st.done=true; save(); render();
}
function setVal(ei,si,f,val){ const st=S.draft.exercises[ei].sets[si];
  st[f]= val===""?"":(f==="reps"?parseInt(val):parseFloat(val)); if(st[f]==="") st[f]=""; save();
  // re-render for PR flag
  render(); }
function toggleDone(ei,si){ const st=S.draft.exercises[ei].sets[si]; st.done=st.done===false?true:false; save(); render(); }
function addSet(ei){ const sets=S.draft.exercises[ei].sets; const p=sets[sets.length-1]||{};
  sets.push({weight:p.weight??"",reps:p.reps??"",done:false}); save(); render(); }
function removeSet(ei){ S.draft.exercises[ei].sets.pop(); save(); render(); }
function removeExercise(ei){ S.draft.exercises.splice(ei,1); save(); render(); }
function addExercise(){
  const name=prompt("Exercise name");
  if(name&&name.trim()){ S.draft.exercises.push({name:name.trim(),
    sets:Array.from({length:3},()=>({weight:"",reps:"",done:false}))}); save(); render(); }
}
function finishSession(){
  const d=S.draft;
  // keep only sets with data
  const clean={...d, exercises:d.exercises.map(ex=>({name:ex.name,
    sets:ex.sets.filter(st=>st.weight!==""&&st.reps!=="").map(st=>({weight:+st.weight,reps:+st.reps}))}))
    .filter(ex=>ex.sets.length)};
  if(!clean.exercises.length){ toast("Log at least one set first"); return; }
  S.sessions.push(clean); S.draft=null; save(); toast("Session saved");
  TAB="history"; HISTSEG="sessions"; render();
}

/* ---------- HISTORY ---------- */
function sessCard(s){
  return `<button class="sess" onclick="openSession('${s.id}')">
    <div class="sess-top"><span class="sess-name">${esc(s.dayName||"Session")}</span>
    <span class="sess-date">${prettyDate(s.date)}</span></div>
    <div class="row between"><span class="sess-stats">${sessionSets(s)} sets · ${fmtNum(sessionVolume(s))}${unit()} volume</span>
    <span class="sess-stats">${s.exercises.length} lifts</span></div></button>`;
}
function viewHistory(){
  let html=`<div class="seg">
    <button class="${HISTSEG==='sessions'?'on':''}" onclick="setHistSeg('sessions')">Sessions</button>
    <button class="${HISTSEG==='progress'?'on':''}" onclick="setHistSeg('progress')">Progress</button></div>`;
  if(HISTSEG==="sessions"){
    if(!S.sessions.length) return html+`<div class="empty"><b>No sessions logged</b>Head to Train and log your first workout.</div>`;
    S.sessions.slice().reverse().forEach(s=>html+=sessCard(s));
    return html;
  }
  // progress: list exercises by frequency
  const map={};
  S.sessions.forEach(s=>s.exercises.forEach(ex=>{ const k=ex.name.toLowerCase();
    if(!map[k]) map[k]={name:ex.name,count:0}; map[k].count++; }));
  const list=Object.values(map).sort((a,b)=>b.count-a.count);
  if(!list.length) return html+`<div class="empty"><b>No data yet</b>Progression charts appear once you've logged some lifts.</div>`;
  list.forEach(x=>{ const best=bestE1RM(x.name);
    html+=`<button class="prog-row" onclick="openProgress('${esc(x.name).replace(/'/g,"\\'")}')">
      <div><div style="font-weight:600">${esc(x.name)}</div><div class="tiny faint num">${x.count} sessions</div></div>
      <div class="best">${fmtNum(best)}${unit()}</div></button>`; });
  return html;
}
function setHistSeg(s){ HISTSEG=s; render(); }

/* ---------- BODY ---------- */
function viewBody(){
  const bw=S.bodyweight.slice().sort((a,b)=>a.date<b.date?-1:1);
  let html=`<div class="view-title">Bodyweight</div>`;
  if(bw.length>=2){
    const latest=bw[bw.length-1], first=bw[0];
    const delta=latest.weight-first.weight;
    html+=`<div class="stat-row">
      <div class="stat"><div class="k">Latest</div><div class="v">${fmtNum(latest.weight)}<small>${unit()}</small></div></div>
      <div class="stat"><div class="k">Change</div><div class="v" style="color:${delta<=0?'var(--pos)':'var(--accent)'}">${delta>0?'+':''}${fmtNum(delta)}<small>${unit()}</small></div></div>
      <div class="stat"><div class="k">Entries</div><div class="v">${bw.length}</div></div></div>`;
    html+=`<div class="card">${lineChart(bw.map(x=>({label:x.date.slice(5),v:x.weight})))}</div>`;
  } else if(bw.length===1){
    html+=`<div class="stat-row"><div class="stat"><div class="k">Latest</div><div class="v">${fmtNum(bw[0].weight)}<small>${unit()}</small></div></div></div>`;
  }
  html+=`<button class="btn primary" onclick="logWeight()">+ Log weight</button>`;
  if(bw.length){
    html+=`<div class="view-title" style="margin-top:26px">Log</div>`;
    bw.slice().reverse().forEach(x=>{
      html+=`<div class="card row between" style="padding:12px 14px">
        <span class="num small muted">${prettyDate(x.date)}</span>
        <span class="row" style="gap:14px"><span class="num" style="font-size:17px">${fmtNum(x.weight)} ${unit()}</span>
        <button class="del-x" onclick="delWeight('${x.date}')">Delete</button></span></div>`;
    });
  } else {
    html+=`<div class="empty"><b>No weigh-ins yet</b>Log weekly to track the trend.</div>`;
  }
  return html;
}
function logWeight(){
  const w=prompt(`Bodyweight (${unit()})`);
  if(w===null) return; const val=parseFloat(w);
  if(isNaN(val)){ toast("Enter a number"); return; }
  const date=todayISO();
  const ex=S.bodyweight.find(x=>x.date===date);
  if(ex) ex.weight=val; else S.bodyweight.push({date,weight:val});
  save(); render(); toast("Logged");
}
function delWeight(date){ S.bodyweight=S.bodyweight.filter(x=>x.date!==date); save(); render(); }

/* ---------- PROGRAMS ---------- */
function viewPrograms(){
  let html=`<div class="view-title">Programs</div>`;
  S.programs.forEach(p=>{
    const active=p.id===S.activeProgramId;
    html+=`<div class="card"><div class="row between" style="margin-bottom:8px">
      <div class="row" style="gap:8px"><span style="font-weight:600;font-size:16px">${esc(p.name)}</span>
      ${active?`<span class="tag">Active</span>`:``}</div></div>
      <div class="small muted num">${p.days.length} days · ${p.days.reduce((a,d)=>a+d.exercises.length,0)} exercises</div>
      <div class="btn-row mt">
        ${active?``:`<button class="btn sm ghost" onclick="setActive('${p.id}')">Set active</button>`}
        <button class="btn sm ghost" onclick="viewProgram('${p.id}')">View</button>
        <button class="btn sm ghost danger" onclick="delProgram('${p.id}')">Delete</button>
      </div></div>`;
  });
  html+=`<div class="btn-row mt"><button class="btn ghost" onclick="importProgram()">Import (paste JSON)</button>
    <button class="btn ghost" onclick="newProgram()">+ New blank</button></div>`;
  return html;
}
function setActive(id){ S.activeProgramId=id; save(); render(); toast("Active program set"); }
function delProgram(id){ if(!confirm("Delete this program? Logged sessions are kept.")) return;
  S.programs=S.programs.filter(p=>p.id!==id);
  if(S.activeProgramId===id) S.activeProgramId=S.programs[0]?.id||null; save(); render(); }
function newProgram(){ const name=prompt("Program name"); if(!name) return;
  const p={id:uid(),name:name.trim(),days:[]}; S.programs.push(p); S.activeProgramId=p.id; save(); viewProgram(p.id); }
function viewProgram(id){
  const p=S.programs.find(x=>x.id===id); if(!p) return;
  let body=``;
  p.days.forEach((d,di)=>{
    body+=`<div class="card"><div class="row between" style="margin-bottom:8px">
      <span style="font-weight:600">${esc(d.name)}</span>
      <button class="del-x" onclick="delDay('${id}','${d.id}')">Remove day</button></div>`;
    d.exercises.forEach(ex=>body+=`<div class="exline"><span>${esc(ex.name)}</span>
      <span class="num">${ex.sets||3}×${esc(ex.repRange||"")}</span></div>`);
    body+=`<button class="link mt" onclick="addProgEx('${id}','${d.id}')">+ Add exercise</button></div>`;
  });
  body+=`<button class="btn ghost" onclick="addDay('${id}')">+ Add day</button>`;
  sheet(esc(p.name),body);
}
function addDay(id){ const p=S.programs.find(x=>x.id===id); const n=prompt("Day name (e.g. Push, Lower)"); if(!n) return;
  p.days.push({id:uid(),name:n.trim(),exercises:[]}); save(); viewProgram(id); }
function delDay(id,did){ const p=S.programs.find(x=>x.id===id); p.days=p.days.filter(d=>d.id!==did); save(); viewProgram(id); }
function addProgEx(id,did){ const p=S.programs.find(x=>x.id===id); const d=p.days.find(x=>x.id===did);
  const n=prompt("Exercise name"); if(!n) return;
  const sets=prompt("Sets","3"); const rr=prompt("Rep range (e.g. 6-8)","8-10");
  d.exercises.push({id:uid(),name:n.trim(),sets:parseInt(sets)||3,repRange:rr||""}); save(); viewProgram(id); }
function importProgram(){
  const body=`<p class="hint">Paste a program as JSON. Accepts one program object or an array of them. Schema:</p>
    <pre class="hint" style="white-space:pre-wrap"><code>{
  "name": "ShredGPT v4",
  "days": [
    { "name": "Push",
      "exercises": [
        {"name":"Bench Press","sets":4,"repRange":"6-8"}
      ]}
  ]
}</code></pre>
    <textarea id="impTxt" placeholder="Paste JSON here"></textarea>
    <button class="btn primary mt" onclick="doImportProgram()">Import</button>`;
  sheet("Import program",body);
}
function doImportProgram(){
  try{
    let data=JSON.parse(document.getElementById("impTxt").value.trim());
    const arr=Array.isArray(data)?data:[data];
    arr.forEach(p=>{
      if(!p.name||!Array.isArray(p.days)) throw new Error("bad shape");
      S.programs.push({id:uid(),name:String(p.name),
        days:p.days.map(d=>({id:uid(),name:String(d.name||"Day"),
          exercises:(d.exercises||[]).map(ex=>({id:uid(),name:String(ex.name),
            sets:parseInt(ex.sets)||3,repRange:String(ex.repRange||ex.reps||"")}))}))});
    });
    S.activeProgramId=S.programs[S.programs.length-1].id;
    save(); closeModal(); render(); toast(`Imported ${arr.length} program${arr.length>1?'s':''}`);
  }catch(e){ toast("Invalid JSON — check the format"); }
}

/* ---------- session detail ---------- */
function openSession(id){
  const s=S.sessions.find(x=>x.id===id); if(!s) return;
  let body=`<div class="small muted num" style="margin-bottom:14px">${prettyDate(s.date)} · ${sessionSets(s)} sets · ${fmtNum(sessionVolume(s))}${unit()} volume</div>`;
  s.exercises.forEach(ex=>{
    body+=`<div class="card"><div style="font-weight:600;margin-bottom:8px">${esc(ex.name)}</div>`;
    ex.sets.forEach((st,i)=>body+=`<div class="exline"><span class="num muted">Set ${i+1}</span>
      <span class="num">${fmtNum(st.weight)}${unit()} × ${st.reps}</span></div>`);
    body+=`</div>`;
  });
  body+=`<button class="btn danger mt" onclick="delSession('${id}')">Delete session</button>`;
  sheet(esc(s.dayName||"Session"),body);
}
function delSession(id){ if(!confirm("Delete this session permanently?")) return;
  S.sessions=S.sessions.filter(x=>x.id!==id); save(); closeModal(); render(); }

/* ---------- progress detail ---------- */
function openProgress(name){
  // per session: top-set weight and best e1RM
  const pts=[];
  S.sessions.forEach(s=>{
    const ex=s.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!ex) return;
    let topW=0,best=0;
    ex.sets.forEach(st=>{ topW=Math.max(topW,st.weight||0); best=Math.max(best,e1rm(st.weight,st.reps)); });
    pts.push({date:s.date,label:s.date.slice(5),topW,best});
  });
  pts.sort((a,b)=>a.date<b.date?-1:1);
  let body=``;
  if(pts.length>=2){
    body+=`<div class="small muted" style="margin-bottom:6px">Estimated 1RM (${unit()})</div>`;
    body+=`<div class="card">${lineChart(pts.map(p=>({label:p.label,v:Math.round(p.best*10)/10})))}</div>`;
    body+=`<div class="stat-row">
      <div class="stat"><div class="k">Best e1RM</div><div class="v">${fmtNum(Math.max(...pts.map(p=>p.best)))}<small>${unit()}</small></div></div>
      <div class="stat"><div class="k">Top set</div><div class="v">${fmtNum(Math.max(...pts.map(p=>p.topW)))}<small>${unit()}</small></div></div></div>`;
  } else {
    body+=`<div class="hint">Need at least two sessions with this lift to chart a trend.</div>`;
  }
  body+=`<div class="view-title" style="margin-top:10px">By session</div>`;
  pts.slice().reverse().forEach(p=>body+=`<div class="exline"><span class="num muted">${prettyDate(p.date)}</span>
    <span class="num">top ${fmtNum(p.topW)}${unit()} · e1RM ${fmtNum(p.best)}</span></div>`);
  sheet(esc(name),body);
}

/* ---------- line chart (svg) ---------- */
function lineChart(data){
  if(!data.length) return "";
  const W=520,H=180,pl=6,pr=6,pt=16,pb=22;
  const iw=W-pl-pr, ih=H-pt-pb;
  const vals=data.map(d=>d.v);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const x=i=>pl+(data.length<=1?iw/2:iw*i/(data.length-1));
  const y=v=>pt+ih-((v-mn)/(mx-mn))*ih;
  let line=data.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(" ");
  let area=`M${x(0).toFixed(1)},${(pt+ih).toFixed(1)} `+data.map((d,i)=>`L${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(" ")+` L${x(data.length-1).toFixed(1)},${(pt+ih).toFixed(1)} Z`;
  let grid="";
  for(let g=0;g<=2;g++){ const gv=mn+(mx-mn)*g/2; const gy=y(gv);
    grid+=`<line class="grid" x1="${pl}" y1="${gy.toFixed(1)}" x2="${W-pr}" y2="${gy.toFixed(1)}"/>
      <text x="${W-pr}" y="${(gy-3).toFixed(1)}" text-anchor="end">${fmtNum(gv)}</text>`; }
  let dots=data.map((d,i)=>`<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="2.6"/>`).join("");
  // x labels: first, mid, last
  const idxs=data.length<=3?data.map((_,i)=>i):[0,Math.floor((data.length-1)/2),data.length-1];
  let xl=idxs.map(i=>`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${data[i].label}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${grid}<path class="area" d="${area}"/><path class="ln" d="${line}"/>${dots}${xl}</svg>`;
}

/* ---------- settings ---------- */
function openSettings(){
  const body=`
    <label class="fld"><span class="lab">Weight unit</span>
      <div class="seg" style="margin:0">
        <button class="${unit()==='kg'?'on':''}" onclick="setUnit('kg')">kg</button>
        <button class="${unit()==='lb'?'on':''}" onclick="setUnit('lb')">lb</button></div></label>
    <div class="divider"></div>
    <div class="lab" style="font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">Backup</div>
    <p class="hint">localStorage can be cleared by the browser. Export a JSON backup periodically, and restore it if you switch device or clear data.</p>
    <div class="btn-row"><button class="btn ghost" onclick="exportAll()">Export backup</button>
      <button class="btn ghost" onclick="importAll()">Restore</button></div>
    <div class="divider"></div>
    <div class="tiny faint num">${S.sessions.length} sessions · ${S.bodyweight.length} weigh-ins · ${S.programs.length} programs</div>
    <p class="tiny faint" style="margin-top:14px;line-height:1.6">Add to Home Screen (Share → Add to Home Screen) for a full-screen, app-like experience. All data stays on this device.</p>`;
  sheet("Settings",body);
}
function setUnit(u){ S.settings.unit=u; save(); openSettings(); render(); }
function exportAll(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`ironlog-backup-${todayISO()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importAll(){
  const body=`<p class="hint">Paste a previously exported backup. This <b>replaces</b> all current data.</p>
    <textarea id="restTxt" placeholder="Paste backup JSON"></textarea>
    <button class="btn danger mt" onclick="doRestore()">Restore (overwrite)</button>`;
  sheet("Restore backup",body);
}
function doRestore(){
  try{ const d=JSON.parse(document.getElementById("restTxt").value.trim());
    if(!d.version&&!d.sessions) throw new Error();
    S={version:1,programs:d.programs||[],activeProgramId:d.activeProgramId||null,
       sessions:d.sessions||[],bodyweight:d.bodyweight||[],draft:d.draft||null,
       settings:d.settings||{unit:"kg"}};
    save(); closeModal(); render(); toast("Backup restored");
  }catch(e){ toast("Invalid backup file"); }
}

/* ---------- modal / toast ---------- */
function sheet(title,body){
  document.getElementById("modal").innerHTML=
    `<div class="scrim" onclick="if(event.target===this)closeModal()">
      <div class="sheet"><div class="sheet-h"><h2>${title}</h2>
      <button class="x" onclick="closeModal()">✕</button></div>${body}</div></div>`;
}
function closeModal(){ document.getElementById("modal").innerHTML=""; }
let toastT;
function toast(msg){ const t=document.getElementById("toast");
  t.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT);
  toastT=setTimeout(()=>t.innerHTML="",1900); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- boot ---------- */
render();
window.addEventListener("beforeunload",save);
</script>
</body>
</html>
